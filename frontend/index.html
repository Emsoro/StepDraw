<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepDraw 画板</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header id="topbar">
            <div class="brand">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="1.5" y="1.5" width="21" height="21" rx="5.5" fill="#3b82f6"/>
                    <path d="M6.5 16.5 L14 9 L16.5 11.5 L9 19 H6.5 Z" fill="#fff"/>
                    <path d="M14 9 L16 7 L18.5 9.5 L16.5 11.5 Z" fill="#ffd166"/>
                </svg>
                <span>StepDraw</span>
            </div>
            <nav class="menu">
                <button id="mNew">新建</button>
                <button id="mOpen">打开</button>
                <button id="mSave">保存</button>
                <button id="mSaveAs">另存为</button>
                <div class="menu-drop">
                    <button id="mExport">导出 <span class="caret">▾</span></button>
                    <div class="dropdown" id="exportMenu">
                        <button data-fmt="png">PNG 图片（位图，2× 清晰度）</button>
                        <button data-fmt="svg">SVG 矢量图（可无损缩放）</button>
                    </div>
                </div>
                <span class="msep"></span>
                <button id="mUndo" class="icon" title="撤销 (Ctrl+Z)" aria-label="撤销">
                    <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7.3 4.4 L3.5 8.2 L7.3 12" transform="translate(.68 0)"/>
                        <path d="M3.5 8.2 H11.5 A3.65 3.65 0 0 1 11.5 15.5" transform="translate(.68 0)"/>
                    </svg>
                </button>
                <button id="mRedo" class="icon" title="重做 (Ctrl+Shift+Z)" aria-label="重做">
                    <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.7 4.4 L16.5 8.2 L12.7 12" transform="translate(-.68 0)"/>
                        <path d="M16.5 8.2 H8.5 A3.65 3.65 0 0 0 8.5 15.5" transform="translate(-.68 0)"/>
                    </svg>
                </button>
            </nav>
            <div class="filename" id="fileName">未命名</div>
            <div class="spacer"></div>
            <span class="badge" id="envBadge">浏览器预览</span>
            <div class="app-links">
                <span class="app-version" id="appVersion" title="当前版本">v1.0.1</span>
                <a class="git-link" href="https://github.com/Emsoro/StepDraw" data-url="https://github.com/Emsoro/StepDraw" title="GitHub" aria-label="GitHub">
                    <svg viewBox="0 0 16 16" width="16" height="16">
                        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                </a>
                <a class="git-link" href="https://gitee.com/masonwu21/StepDraw" data-url="https://gitee.com/masonwu21/StepDraw" title="Gitee" aria-label="Gitee">
                    <svg viewBox="0 0 1024 1024" width="16" height="16">
                        <path fill="currentColor" d="M512 1024q-104 0-199-40-92-39-163-110T40 711Q0 616 0 512t40-199Q79 221 150 150T313 40q95-40 199-40t199 40q92 39 163 110t110 163q40 95 40 199t-40 199q-39 92-110 163T711 984q-95 40-199 40z m259-569H480q-10 0-17.5 7.5T455 480v64q0 10 7.5 17.5T480 569h177q11 0 18.5 7.5T683 594v13q0 31-22.5 53.5T607 683H367q-11 0-18.5-7.5T341 657V417q0-31 22.5-53.5T417 341h354q11 0 18-7t7-18v-63q0-11-7-18t-18-7H417q-38 0-72.5 14T283 283q-27 27-41 61.5T228 417v354q0 11 7 18t18 7h373q46 0 85.5-22.5t62-62Q796 672 796 626V480q0-10-7-17.5t-18-7.5z"/>
                    </svg>
                </a>
            </div>
        </header>

        <div id="main">
            <aside id="toolbar">
                <button class="tbtn" data-tool="select" title="选择 V">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
                        <path d="M5 3 L15.5 8.6 L10.8 10 L9.4 14.8 Z"/>
                    </svg><span class="kbd">V</span>
                </button>
                <button class="tbtn" data-tool="hand" title="手型（平移） H">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 2.5v15M2.5 10h15M10 2.5 7.8 4.7M10 2.5l2.2 2.2M10 17.5l-2.2-2.2M10 17.5l2.2-2.2M2.5 10l2.2-2.2M2.5 10l2.2 2.2M17.5 10l-2.2-2.2M17.5 10l-2.2 2.2"/>
                    </svg><span class="kbd">H</span>
                </button>
                <span class="tsep"></span>
                <button class="tbtn" data-tool="pencil" title="铅笔（自由绘制） D">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
                        <path d="M4 16.2 L13.5 6.7 L16.3 9.5 L6.8 19 H4 Z"/>
                        <path d="M13.5 6.7 L15.4 4.8 a1.3 1.3 0 0 1 1.9 0 l0.4 0.4 a1.3 1.3 0 0 1 0 1.9 L15.8 9"/>
                    </svg><span class="kbd">D</span>
                </button>
                <button class="tbtn" data-tool="eraser" title="橡皮 E">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
                        <path d="M7.5 15.5 L3.8 11.8 a1.5 1.5 0 0 1 0-2.1 L10.5 3 a1.5 1.5 0 0 1 2.1 0 l3.9 3.9 a1.5 1.5 0 0 1 0 2.1 L9.6 15.9 H7.5 Z"/>
                        <path d="M7 8.5 L11.5 13"/>
                        <path d="M4 17.5 H16"/>
                    </svg><span class="kbd">E</span>
                </button>
                <span class="tsep"></span>
                <button class="tbtn" data-tool="rect" title="矩形 R">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                        <rect x="3.5" y="5" width="13" height="10" rx="1.5"/>
                    </svg><span class="kbd">R</span>
                </button>
                <button class="tbtn" data-tool="ellipse" title="椭圆 O">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                        <ellipse cx="10" cy="10" rx="6.8" ry="5.2"/>
                    </svg><span class="kbd">O</span>
                </button>
                <button class="tbtn" data-tool="diamond" title="菱形（判断） F">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
                        <path d="M10 3 L17 10 L10 17 L3 10 Z"/>
                    </svg><span class="kbd">F</span>
                </button>
                <button class="tbtn" data-tool="arrow" title="箭头（连接图形） A">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 16 L15.5 4.5"/>
                        <path d="M9 4.5 H15.5 V11"/>
                    </svg><span class="kbd">A</span>
                </button>
                <span class="tsep"></span>
                <button class="tbtn" data-tool="text" title="文本 T">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                        <path d="M4.5 4.5 H15.5 M10 4.5 V16"/>
                    </svg><span class="kbd">T</span>
                </button>
                <span class="tsep bottom"></span>
                <button id="btnClear" class="tbtn" title="清空画布（Ctrl+Shift+Delete，可撤销）" aria-label="清空画布">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3.8 5.6 H16.2"/>
                        <path d="M7.8 5.6 V3.7 H12.2 V5.6"/>
                        <path d="M5.9 5.6 L6.7 16.5 H13.3 L14.1 5.6"/>
                        <path d="M8.5 8.6 V13.7 M11.5 8.6 V13.7"/>
                    </svg>
                </button>
            </aside>

            <div id="canvasWrap">
                <canvas id="canvas"></canvas>
                <textarea id="editor" spellcheck="false"></textarea>
                <div id="zoombar">
                    <button id="zoomOut" title="缩小">−</button>
                    <button id="zoomPct" title="重置为 100%">100%</button>
                    <button id="zoomIn" title="放大">+</button>
                    <span class="zsep"></span>
                    <button id="zoomFit" title="适应全部内容 (Shift+1)">适应</button>
                </div>
                <div id="hintbar"></div>
            </div>

            <aside id="stylebar">
                <button id="styleToggle" class="style-toggle" title="折叠样式面板" aria-label="折叠样式面板"></button>
                <div class="sb-scroll">
                    <div class="sec">
                        <div class="sec-title">描边颜色</div>
                        <div class="swatches" id="strokeColors" data-key="stroke"></div>
                    </div>
                    <div class="sec">
                        <div class="sec-title">填充颜色</div>
                        <div class="swatches" id="fillColors" data-key="fill"></div>
                    </div>
                    <div class="sec">
                        <div class="sec-title">线宽</div>
                        <div class="seg" id="segSize"></div>
                    </div>
                    <div class="sec">
                        <div class="sec-title">线型</div>
                        <div class="seg" id="segDash"></div>
                    </div>
                    <div class="sec">
                        <div class="sec-title">字号</div>
                        <div class="seg" id="segFont"></div>
                    </div>
                    <div class="sec">
                        <div class="sec-title">字体</div>
                        <select id="fontFamily" class="font-select" title="选择字体"></select>
                    </div>
                    <div class="sec" id="routeSec">
                        <div class="sec-title">箭头样式</div>
                        <div class="seg" id="segRoute"></div>
                    </div>
                    <div class="sec sec-actions">
                        <button id="btnDup" class="action">复制选中 (Ctrl+D)</button>
                        <button id="btnDelete" class="danger">删除选中 (Del)</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>
    <div id="toast"></div>

    <script src="js/bridge.js"></script>
    <script src="js/geometry.js"></script>
    <script src="js/state.js"></script>
    <script src="js/render.js"></script>
    <script src="js/svg.js"></script>
    <script src="js/tools.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
